services:
  api:
    build: .
    ports:
      - "8002:8000"
    volumes:
      - .:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy

  db:
      image: postgres:17
      restart: unless-stopped
      env_file:
        - .env
      ports:
        - "5432:5432"
      volumes:
        - postgres_data:/var/lib/postgresql/data
      healthcheck:
        test: ["CMD-SHELL", "pg_isready -U postgres -d my_database"]
        interval: 5s
        timeout: 5s
        retries: 5

volumes:
  postgres_data: